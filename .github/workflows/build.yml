name: Build Patched qca_cld3_wlan.ko

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'GKI ядро 5.15.41'
        required: true
        default: 'https://android.googlesource.com/kernel/common'
      kernel_branch:
        description: 'Тег/ветка ядра (ровно 5.15.41)'
        required: true
        default: 'android13-5.15-2022-08_r3'
      modules_repo:
        description: 'Модули SM6225 (qcacld-3.0 + platform)'
        required: true
        default: 'https://github.com/xiaomi-6225-AD/android_kernel_xiaomi_sm6225-modules'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Загрузка файлов из твоего репозитория
        uses: actions/checkout@v4

      - name: 2. Установка зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential cpio flex libssl-dev libelf-dev python3 zip curl git kmod

      - name: 3. Установка Clang и LLVM
        run: |
          mkdir -p clang/bin
          VER=""
          for v in 14 15 16 17 18 ""; do
            PKG_SFX=${v:+-$v}
            if sudo apt-get install -y "clang${PKG_SFX}" "lld${PKG_SFX}" "llvm${PKG_SFX}"; then
              VER="$PKG_SFX"
              break
            fi
          done
          for tool in clang clang++ ld.lld llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-readelf llvm-strip; do
            BIN=$(command -v "${tool}${VER}" || command -v "$tool" || true)
            [ -n "$BIN" ] && ln -sf "$BIN" "$PWD/clang/bin/$tool"
          done
          ./clang/bin/clang --version

      - name: 4. Клонирование ядра 5.15.41 и модулей WLAN
        run: |
          git clone --depth=1 --branch "${{ inputs.kernel_branch }}" "${{ inputs.kernel_repo }}" kernel
          git clone --depth=1 "${{ inputs.modules_repo }}" modules

      - name: 5. Патч qcacld-3.0 и настройка Kbuild
        run: |
          WLAN_DIR=$(find "$PWD/modules" -maxdepth 5 -type d -name "qcacld-3.0" | head -n 1)
          echo "WLAN_DIR=$WLAN_DIR" >> $GITHUB_ENV
          python3 patch_inject.py "$WLAN_DIR"

          # Убираем -Werror и добавляем все заголовки Qualcomm platform напрямую в Kbuild
          sed -i -E 's/-Werror(=[^[:space:]]+)?//g' "$WLAN_DIR/Kbuild"
          {
            echo ""
            echo "ccflags-y += -Wno-error -Wno-unused-function -Wno-incompatible-pointer-types"
            find "$PWD/modules/qcom/opensource/wlan/platform" -type d -name "inc" 2>/dev/null | while read -r d; do
              echo "ccflags-y += -I$d"
            done
          } >> "$WLAN_DIR/Kbuild"

      - name: 6. Подготовка ядра (vermagic 5.15.41 + твои CRC)
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          cd kernel
          rm -f localversion*
          touch .scmversion
          mkdir -p out
          cp "$GITHUB_WORKSPACE/device_defconfig" out/.config
          scripts/config --file out/.config \
            --set-str LOCALVERSION "" \
            --disable LOCALVERSION_AUTO \
            --disable MODULE_SIG \
            --disable MODULE_SIG_ALL \
            --disable MODULE_SIG_FORCE \
            --disable DEBUG_INFO_BTF \
            --disable DEBUG_INFO_BTF_MODULES \
            --disable TRIM_UNUSED_KSYMS \
            --enable MODVERSIONS
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 olddefconfig
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 modules_prepare -j$(nproc)
          cp "$GITHUB_WORKSPACE/device_symvers.txt" out/Module.symvers

      - name: 7. Сборка и очистка qca_cld3_wlan.ko
        run: |
          export PATH="$PWD/clang/bin:$PATH"
          PROFILE="default"
          for p in bengal khaje default; do
            if [ -f "$WLAN_DIR/configs/${p}_defconfig" ]; then
              PROFILE="$p"
              break
            fi
          done
          echo "Используем профиль WLAN: $PROFILE"

          set +e
          make -C "$PWD/kernel" O="$PWD/kernel/out" M="$WLAN_DIR" \
            ARCH=arm64 LLVM=1 LLVM_IAS=1 \
            KBUILD_MODPOST_WARN=1 \
            KERNEL_SRC="$PWD/kernel" \
            WLAN_ROOT="$WLAN_DIR" \
            MODNAME=qca_cld3_wlan \
            CONFIG_QCA_CLD_WLAN=m \
            CONFIG_QCA_CLD_WLAN_PROFILE="$PROFILE" \
            CONFIG_FEATURE_MONITOR_MODE_SUPPORT=y \
            KCFLAGS="-Wno-error" \
            modules -j$(nproc) 2>&1 | tee build.log
          RC=${PIPESTATUS[0]}
          set -e

          if [ "$RC" -ne 0 ]; then
            echo "========== ТОЧНЫЕ ОШИБКИ КОМПИЛЯЦИИ =========="
            grep -E "error:|fatal error:" build.log | head -n 30
            exit "$RC"
          fi

          KO=$(find "$WLAN_DIR" "$PWD/kernel/out" -name "*.ko" | grep -i wlan | head -n 1)
          echo "Собран файл: $KO"
          "$PWD/clang/bin/llvm-strip" --strip-debug "$KO" -o "$PWD/ksu_module/qca_cld3_wlan.ko"
          ls -lh "$PWD/ksu_module/qca_cld3_wlan.ko"
          modinfo "$PWD/ksu_module/qca_cld3_wlan.ko" | grep -E "vermagic|depends|name"

      - name: 8. Упаковка модуля KernelSU
        run: |
          cd ksu_module
          zip -r ../tapas_wlan_inject_ksu.zip .

      - name: 9. Выгрузка артефактов
        uses: actions/upload-artifact@v4
        with:
          name: tapas-wlan-inject-ksu
          path: |
            tapas_wlan_inject_ksu.zip
            ksu_module/qca_cld3_wlan.ko
