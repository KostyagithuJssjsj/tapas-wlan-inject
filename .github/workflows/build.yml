name: Build patched qca_cld3_wlan.ko (tapas)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install toolchain and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm \
            gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev \
            python3 cpio xz-utils zip kmod

      - name: 3. Clone Xiaomi SM6225 msm-5.15 kernel (topaz-t-oss) & modules
        run: |
          git clone --depth=1 --branch topaz-t-oss \
            https://github.com/MiCode/Xiaomi_Kernel_OpenSource.git kernel

          git clone --depth=1 \
            https://github.com/xiaomi-6225-AD/android_kernel_xiaomi_sm6225-modules.git modules

          if [ -f kernel/Makefile ]; then
            KDIR="$PWD/kernel"
          elif [ -f kernel/kernel_platform/msm-kernel/Makefile ]; then
            KDIR="$PWD/kernel/kernel_platform/msm-kernel"
          else
            KDIR="$(dirname "$(find kernel -maxdepth 3 -name Makefile -exec grep -l '^VERSION = 5' {} + | head -n1)")"
          fi
          echo "KDIR=$KDIR" >> "$GITHUB_ENV"

          echo "=== Kernel Makefile ==="
          head -n 5 "$KDIR/Makefile"
          echo "=== Check qcom-iommu-util.h ==="
          find "$KDIR" -name "qcom-iommu-util.h" || true

      - name: 4. Apply TX injection patch
        run: |
          WLAN_DIR="$PWD/modules/qcom/opensource/wlan/qcacld-3.0"
          ln -sfn "$WLAN_DIR" "$PWD/qcacld-3.0"
          if ! python3 patch_inject.py "$WLAN_DIR"; then
            (cd "$WLAN_DIR" && python3 "$GITHUB_WORKSPACE/patch_inject.py")
          fi

      - name: 5. Strip -Werror from qcacld-3.0 Kbuild/Makefiles
        run: |
          find modules/qcom/opensource/wlan -type f \( -name "Kbuild*" -o -name "Makefile*" \) \
            -exec sed -i 's/-Werror[^ ]*//g' {} +
          sed -i 's/-Werror=strict-prototypes//g' "${{ env.KDIR }}/Makefile"

      - name: 6. Prepare kernel tree (vermagic 5.15.41 + device_symvers)
        run: |
          KDIR="${{ env.KDIR }}"
          cp device_defconfig "$KDIR/.config"

          sed -i 's/^SUBLEVEL =.*/SUBLEVEL = 41/' "$KDIR/Makefile"
          sed -i 's/^EXTRAVERSION =.*/EXTRAVERSION =/' "$KDIR/Makefile"
          touch "$KDIR/.scmversion"

          "$KDIR/scripts/config" --file "$KDIR/.config" \
            --set-str CONFIG_LOCALVERSION "" \
            --disable CONFIG_LOCALVERSION_AUTO \
            --enable CONFIG_MODVERSIONS \
            --disable CONFIG_MODULE_SIG_ALL \
            --disable CONFIG_MODULE_SIG_FORCE

          make -C "$KDIR" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="" \
            olddefconfig

          make -C "$KDIR" \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="" \
            -j"$(nproc)" \
            modules_prepare

          python3 - "$KDIR/Module.symvers" <<'PY'
          import sys
          out_path = sys.argv[1]
          rows = []
          with open("device_symvers.txt", "r", encoding="utf-8", errors="ignore") as f:
              for line in f:
                  line = line.strip()
                  if not line or line.startswith("#"):
                      continue
                  parts = line.split()
                  if len(parts) >= 4:
                      rows.append("\t".join(parts[:4]))
                  elif len(parts) == 2:
                      crc, sym = parts
                      if not crc.startswith("0x"):
                          crc = "0x" + crc
                      rows.append(f"{crc}\t{sym}\tvmlinux\tEXPORT_SYMBOL")
          with open(out_path, "w", encoding="utf-8") as out:
              out.write("\n".join(rows) + "\n")
          print(f"Wrote {len(rows)} symbols to {out_path}")
          PY

      - name: 7. Build qca_cld3_wlan.ko
        run: |
          set -o pipefail
          KDIR="${{ env.KDIR }}"
          WLAN_DIR="$PWD/modules/qcom/opensource/wlan/qcacld-3.0"
          CFG_H="$KDIR/include/net/cfg80211.h"

          WLAN_PROFILE="default"
          for prof in khaje bengal adrastea qca6174; do
            if [ -f "$WLAN_DIR/configs/${prof}_defconfig" ]; then
              WLAN_PROFILE="$prof"
              break
            fi
          done
          echo "Selected WLAN_PROFILE=$WLAN_PROFILE"

          # Подключаем include-каталоги wlan + все нужные подкаталоги cmn/hif (SNOC/CE/dispatcher)
          EXTRA_INC=""
          for d in $(find "$PWD/modules/qcom/opensource/wlan" -maxdepth 4 -type d -name "include" 2>/dev/null); do
            EXTRA_INC="$EXTRA_INC -I$d"
          done
          for d in $(find "$WLAN_DIR/cmn/hif" -maxdepth 3 -type d ! -name pcie ! -name usb ! -name sdio ! -name ipcie 2>/dev/null); do
            EXTRA_INC="$EXTRA_INC -I$d"
          done

          # Включаем MLO/link_id макросы qcacld-3.0 под cfg80211.h ядра
          MLO_FLAGS=""
          grep -qF "unsigned int link_id" "$CFG_H" && MLO_FLAGS="$MLO_FLAGS -DCFG80211_SINGLE_NETDEV_MULTI_LINK_SUPPORT"
          grep -qF "struct link_station_parameters" "$CFG_H" && MLO_FLAGS="$MLO_FLAGS -DCFG80211_LINK_STA_PARAMS_PRESENT"
          grep -qF "int link_id, const u8 *mac_addr" "$CFG_H" && MLO_FLAGS="$MLO_FLAGS -DCFG80211_MLO_KEY_OPERATION_SUPPORT"
          grep -qF "MLD address of the peer" "$CFG_H" && MLO_FLAGS="$MLO_FLAGS -DCFG80211_EXTERNAL_AUTH_MLO_SUPPORT"
          grep -qF "unsigned int link_id, u16 punct_bitmap" "$CFG_H" && MLO_FLAGS="$MLO_FLAGS -DCFG80211_RU_PUNCT_NOTIFY"
          echo "MLO_FLAGS=$MLO_FLAGS"

          make -C "$KDIR" \
            M="$WLAN_DIR" \
            WLAN_ROOT="$WLAN_DIR" \
            KERNEL_SRC="$KDIR" \
            MODNAME=qca_cld3_wlan \
            CONFIG_QCA_CLD_WLAN=m \
            CONFIG_QCA_CLD_WLAN_PROFILE="$WLAN_PROFILE" \
            CONFIG_HIF_SNOC=y \
            CONFIG_ICNSS2=y \
            ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CC=clang \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="" \
            KBUILD_MODPOST_WARN=1 \
            KCFLAGS="$EXTRA_INC $MLO_FLAGS -Wno-error -Wno-strict-prototypes -Wno-error=strict-prototypes -Wno-deprecated-non-prototype" \
            -j"$(nproc)" \
            modules 2>&1 | tee build.log || {
              echo "=== FIRST COMPILER ERRORS ==="
              grep -n "error:" build.log | head -n 40
              exit 1
            }

          KO_PATH="$(find "$WLAN_DIR" -maxdepth 2 -name "*.ko" | head -n1)"
          test -n "$KO_PATH"
          cp "$KO_PATH" "$PWD/qca_cld3_wlan.ko"

          echo "=== modinfo qca_cld3_wlan.ko ==="
          modinfo "$PWD/qca_cld3_wlan.ko"
          echo "=== CFI & __versions check ==="
          aarch64-linux-gnu-readelf -S "$PWD/qca_cld3_wlan.ko" | grep -E "cfi|versions" || true

      - name: 8. Package KernelSU module ZIP
        run: |
          mkdir -p ksu_module/vendor_dlkm/lib/modules
          cp qca_cld3_wlan.ko ksu_module/vendor_dlkm/lib/modules/qca_cld3_wlan.ko
          (cd ksu_module && zip -r ../tapas_wlan_inject_ksu.zip .)

      - name: 9. Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tapas-qca_cld3_wlan
          path: |
            qca_cld3_wlan.ko
            tapas_wlan_inject_ksu.zip
